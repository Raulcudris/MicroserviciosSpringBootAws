server:
  port: 8080

spring:
  application:
    name: msvc-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: products-services
          uri: lb://msvc-products
          predicates:
            - Path=/products/**

        - id: orders-services
          uri: lb://msvc-orders
          predicates:
            - Path=/orders/**

        - id: payments-services
          uri: lb://msvc-pay
          predicates:
            - Path=/pay/**

        - id: users-services
          uri: lb://msvc-users
          predicates:
            - Path=/users/**

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://msvc-eureka.inventario-ms.local:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: msvc-gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always