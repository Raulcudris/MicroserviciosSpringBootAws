server:
  port: 8002

spring:
  application:
    name: msvc-orders

  datasource:
    url: jdbc:mysql://<RDS_ENDPOINT>:3306/ecommerce_myshop
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      initializationFailTimeout: 0
      connectionTimeout: 30000
      maximumPoolSize: 10

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://msvc-eureka.inventario-ms.local:8761/eureka
  instance:
    prefer-ip-address: true