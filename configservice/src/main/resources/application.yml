spring:
  application:
    name: msvc-config

  cloud:
    config:
      server:
        git:
          uri: https://github.com/Raulcudris/MicroserviciosSpringBootAws.git
          default-label: deploy
          search-paths: config-data
          clone-on-start: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
